<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wills — Blog</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="alternate" type="application/rss+xml" title="Wills updates RSS feed" href="https://lumenate.usercue.app/api/changelog/rss">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');

    :root {
      --md-sys-color-primary: #1a73e8;
      --md-sys-color-on-surface: #0058be;
      --md-sys-color-subtext: #4a5e89;
      --md-card-bg: rgba(255, 255, 255, 0.9);
      --md-card-border: #e0e2e8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --md-sys-color-primary: #a8c7fa;
        --md-sys-color-on-surface: #d3e3fd;
        --md-sys-color-subtext: #a8c7fa;
        --md-card-bg: rgba(30, 31, 35, 0.9);
        --md-card-border: #33353a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', sans-serif;
      background-color: #1a73e8;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--md-sys-color-on-surface);
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 14px;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    nav a {
      color: var(--md-sys-color-primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
    }

    nav a:hover,
    .feed-link:hover { text-decoration: underline; }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .banner-card {
      background: var(--md-card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--md-card-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .banner {
      width: 100%;
      height: 220px;
      background-color: var(--md-sys-color-primary);
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      color: var(--md-sys-color-on-surface);
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 32px;
    }

    h2 {
      color: var(--md-sys-color-subtext);
      font-size: 18px;
      font-weight: 500;
      margin-top: 0;
      margin-bottom: 12px;
    }

    p {
      color: var(--md-sys-color-subtext);
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 0;
    }

    .post-header h2 { margin: 0; }

    .date {
      color: var(--md-sys-color-subtext);
      font-size: 13px;
      white-space: nowrap;
    }

    .post-content { padding: 16px 20px 24px; }

    .post-content p + p { margin-top: 12px; }

    .feed-link {
      color: var(--md-sys-color-primary);
      font-weight: 500;
      text-decoration: none;
    }

    .loading { text-align: center; }

    .feed-error {
      padding: 20px;
      text-align: center;
    }

    @media (max-width: 420px) {
      .post-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index">Home</a>
    <a href="changelog">Changelog</a>
    <a href="safety">Safety</a>
    <a href="blog">Blog</a>
  </nav>

  <main class="container">
    <article class="banner-card">
      <img src="images/PrismSecondary.png" alt="Prism Secondary" class="banner" onerror="this.style.display='none'">
      <div class="content">
        <h1>NEW SCHOOL</h1>
        <p>I'm making a new school on Roblox called Prism Secondary.</p>
      </div>
    </article>

    <section id="feed-posts" aria-live="polite">
      <article class="banner-card loading">
        <div class="post-content"><p>Loading blog posts…</p></div>
      </article>
    </section>

    <p style="text-align: center;">
      <a class="feed-link" href="https://lumenate.usercue.app/api/changelog/rss">Subscribe to updates via RSS</a>
    </p>
  </main>

  <script>
    const feedUrl = 'https://lumenate.usercue.app/api/changelog/rss';
    const feedPosts = document.getElementById('feed-posts');

    const escapeHtml = (value) => {
      const element = document.createElement('div');
      element.textContent = value || '';
      return element.innerHTML;
    };

    async function loadFeed() {
      try {
        const response = await fetch(feedUrl, { headers: { 'Accept': 'application/rss+xml, application/xml, text/xml' } });
        if (!response.ok) throw new Error(`Feed request failed: ${response.status}`);

        const xml = await response.text();
        const documentXml = new DOMParser().parseFromString(xml, 'application/xml');
        if (documentXml.querySelector('parsererror')) throw new Error('Feed returned invalid XML');

        const items = [...documentXml.querySelectorAll('item')];
        if (!items.length) {
          feedPosts.innerHTML = '<article class="banner-card feed-error"><p>No blog posts are available yet.</p></article>';
          return;
        }

        feedPosts.innerHTML = items.map(item => {
          const title = item.querySelector('title')?.textContent.trim() || 'Untitled post';
          const link = item.querySelector('link')?.textContent.trim();
          const description = item.querySelector('description')?.textContent.trim() || '';
          const pubDate = item.querySelector('pubDate')?.textContent.trim();
          const date = pubDate ? new Date(pubDate) : null;
          const dateText = date && !Number.isNaN(date.getTime())
            ? date.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })
            : '';
          const dateAttribute = date && !Number.isNaN(date.getTime())
            ? date.toISOString()
            : '';

          const descriptionHtml = document.createElement('div');
          descriptionHtml.innerHTML = description;

          return `
            <article class="banner-card">
              <header class="post-header">
                <h2>${link ? `<a class="feed-link" href="${escapeHtml(link)}">${escapeHtml(title)}</a>` : escapeHtml(title)}</h2>
                ${dateText ? `<time class="date" datetime="${escapeHtml(dateAttribute)}">${escapeHtml(dateText)}</time>` : ''}
              </header>
              <div class="post-content">${descriptionHtml.innerHTML}</div>
            </article>
          `;
        }).join('');
      } catch (error) {
        console.error(error);
        feedPosts.innerHTML = `
          <article class="banner-card feed-error">
            <p>Couldn't load the RSS posts in this browser.</p>
            <p><a class="feed-link" href="${feedUrl}">Open the RSS feed</a></p>
          </article>
        `;
      }
    }

    loadFeed();
  </script>
</body>
</html>
