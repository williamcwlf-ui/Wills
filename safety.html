<style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');

    :root {
      --md-sys-color-primary: #1a73e8;
      --md-sys-color-on-surface: #0058be;
      --md-sys-color-subtext: #4a5e89;
      --md-card-bg: rgba(255, 255, 255, 0.9);
      --md-card-border: #e0e2e8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --md-sys-color-primary: #a8c7fa;
        --md-sys-color-on-surface: #d3e3fd;
        --md-sys-color-subtext: #a8c7fa;
        --md-card-bg: rgba(30, 31, 35, 0.9);
        --md-card-border: #33353a;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', sans-serif;
      
      /* Full background image */
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      
      min-height: 100vh;
      color: var(--md-sys-color-on-surface);
    }

    /* Navigation Bar */
    nav {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 14px;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    nav a {
      color: var(--md-sys-color-primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* Main Container */
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Card Styling */
    .banner-card {
      background: var(--md-card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--md-card-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .banner {
      width: 100%;
      height: 220px;
      background-color: var(--md-sys-color-primary);
      object-type: cover;
      display: block;
    }

    .content {
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      color: var(--md-sys-color-on-surface);
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 32px;
    }

    h2 {
      color: var(--md-sys-color-subtext);
      font-size: 18px;
      font-weight: 500;
      margin-top: 0;
      margin-bottom: 12px;
    }

    p {
      color: var(--md-sys-color-subtext);
      margin: 0;
      font-size: 16px;
    }

    /* Audio Header Tag */
    .audio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 10px;
    }

    .version-tag {
      background: var(--md-sys-color-primary);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 13px;
    }

    .date {
      color: var(--md-sys-color-subtext);
      font-size: 13px;
    }
  </style>
<div class="banner-card">
  <img src="banner.jpg" alt="Top Banner" class="banner" onerror="this.style.display='none'">
  <div class="content">
    <h1>Safety</h1>
    <p>To Us safety matters the most that why we have loads of docs on Safety.</p>
    <p>If you would like to send some docs on safety then email us </p>
  </div>
</div>
