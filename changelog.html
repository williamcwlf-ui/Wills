<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wills - Changelog</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');

    :root {
      --md-sys-color-primary: #1a73e8;
      --md-sys-color-on-surface: #0058be;
      --md-sys-color-subtext: #4a5e89;
      --md-sys-color-bg: #ffffff;
      --md-card-bg: #f8f9fa;
      --md-card-border: #e0e2e8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --md-sys-color-primary: #a8c7fa;
        --md-sys-color-on-surface: #d3e3fd;
        --md-sys-color-subtext: #a8c7fa;
        --md-sys-color-bg: #121316;
        --md-card-bg: #1e1f23;
        --md-card-border: #33353a;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', sans-serif;
      background-color: var(--md-sys-color-bg);
      color: var(--md-sys-color-on-surface);
    }

    /* Navigation Bar */
    nav {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    nav a {
      color: var(--md-sys-color-primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .header-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px 20px 20px;
    }

    h1 {
      color: var(--md-sys-color-on-surface);
      margin: 0;
      font-size: 28px;
    }

    /* Material 3 Spinning Blob Shape */
    .m3-shape {
      width: 32px;
      height: 32px;
      background-color: var(--md-sys-color-primary);
      animation: spinMorph 8s linear infinite;
    }

    @keyframes spinMorph {
      0% {
        transform: rotate(0deg);
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      }
      50% {
        border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
      }
      100% {
        transform: rotate(360deg);
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      }
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Update Card */
    .update-card {
      background: var(--md-card-bg);
      border: 1px solid var(--md-card-border);
      border-radius: 16px;
      padding: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .version-tag {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-bg);
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 14px;
    }

    .date {
      color: var(--md-sys-color-subtext);
      font-size: 13px;
    }

    ul {
      margin: 0;
      padding-left: 20px;
      color: var(--md-sys-color-subtext);
    }

    li {
      margin-bottom: 6px;
      line-height: 1.5;
    }

    /* Animated Gradient Bar */
    .moving-color-box {
      width: 100%;
      height: 120px;
      background: linear-gradient(270deg, #aec6ff, #b2c6f7, #f2afff);
      background-size: 600% 600%;
      animation: colorShift 6s ease infinite;
    }

    @keyframes colorShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html">Home</a>
    <a href="changelog.html">Changelog</a>
  </nav>

  <!-- Header with Spinning Shape -->
  <div class="header-section">
    <div class="m3-shape"></div>
    <h1>Changelog</h1>
  </div>

  <main class="container">

    <article class="update-card">
      <div class="card-header">
        <span class="version-tag">v1.1.0</span>
        <span class="date">October 29, 2026</span>
      </div>
      <ul>
        <li>Added animated gradient background sections</li>
        <li>Implemented clean navigation bar linking pages</li>
        <li>Added Material Design morphing shape icon</li>
      </ul>
    </article>

    <article class="update-card">
      <div class="card-header">
        <span class="version-tag">v1.0.0</span>
        <span class="date">October 15, 2026</span>
      </div>
      <ul>
        <li>Initial website launch</li>
      </ul>
    </article>

  </main>

  <div class="moving-color-box"></div>

</body>
</html>
