<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wills</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');

    :root {
      --md-sys-color-primary: #1a73e8;
      --md-sys-color-on-surface: #0058be;
      --md-sys-color-subtext: #4a5e89;
      --md-card-bg: rgba(255, 255, 255, 0.9);
      --md-card-border: #e0e2e8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --md-sys-color-primary: #a8c7fa;
        --md-sys-color-on-surface: #d3e3fd;
        --md-sys-color-subtext: #a8c7fa;
        --md-card-bg: rgba(30, 31, 35, 0.9);
        --md-card-border: #33353a;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', sans-serif;
      
      /* Fallback color & Full background image */
      background-color: #1a73e8;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      
      min-height: 100vh;
      color: var(--md-sys-color-on-surface);
    }

    /* Navigation Bar */
    nav {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 14px;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    nav a {
      color: var(--md-sys-color-primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* Main Container */
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Card Styling */
    .banner-card {
      background: var(--md-card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--md-card-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .banner {
      width: 100%;
      height: 220px;
      background-color: var(--md-sys-color-primary);
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      color: var(--md-sys-color-on-surface);
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 32px;
    }

    h2 {
      color: var(--md-sys-color-subtext);
      font-size: 18px;
      font-weight: 500;
      margin-top: 0;
      margin-bottom: 12px;
    }

    p {
      color: var(--md-sys-color-subtext);
      margin: 0;
      font-size: 16px;
    }

    /* Audio Header Tag */
    .audio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 10px;
    }

    .version-tag {
      background: var(--md-sys-color-primary);
      color: #00008B;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 13px;
    }

    .date {
      color: var(--md-sys-color-subtext);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index">Home</a>
    <a href="changelog">Changelog</a>
    <a href="safety">Safety</a>
     <a href="blog">Blog</a>
  </nav>

  <main class="container">

    <!-- Card 1: Welcome Header -->
    <div class="banner-card">
      <img src="banner.jpg" alt="Top Banner" class="banner" onerror="this.style.display='none'">
      <div class="content">
        <h1>Hello, World!</h1>
        <p>Welcome to my website</p>
      </div>
    </div>

    <!-- Card 2: Workplaces -->
    <div class="banner-card">
      <div class="content">
        <h1>My Workplaces</h1>
        <h2>I have worked at:</h2>
        <p><strong>Team William Rblx</strong> — CEO</p> 
      </div>
    </div>

    <!-- Card 3: YouTube Audio Player -->
    <div class="banner-card">
      <div class="audio-header">
        <span class="version-tag">Audio</span>
        <span class="date">Now Playing</span>
      </div>
      <div style="padding: 0 16px 16px;">
        <div style="position: relative; width: 100%; height: 0; padding-bottom: 56.25%; border-radius: 12px; overflow: hidden;">
          <iframe 
            src="https://www.youtube.com/embed/zSnbp0z-FGg?start=1&autoplay=1" 
            title="YouTube audio player" 
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>
      </div>
    </div>

  </main>

</body>
</html>
