<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wills</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');

    :root {
      --md-sys-color-primary: #1a73e8;
      --md-sys-color-on-surface: #0058be;
      --md-sys-color-subtext: #4a5e89;
      --md-sys-color-bg: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --md-sys-color-primary: #a8c7fa;
        --md-sys-color-on-surface: #d3e3fd;
        --md-sys-color-subtext: #a8c7fa;
        --md-sys-color-bg: #121316;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', sans-serif;
      background-color: var(--md-sys-color-bg);
      color: var(--md-sys-color-on-surface);
      transition: background-color 0.3s ease;
    }

    /* Navigation Bar */
    nav {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    nav a {
      color: var(--md-sys-color-primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* Top Banner */
    .banner {
      width: 100%;
      height: 200px;
      background-color: var(--md-sys-color-primary);
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      color: var(--md-sys-color-on-surface);
      margin-bottom: 8px;
      font-size: 32px;
    }

    p {
      color: var(--md-sys-color-subtext);
      margin-top: 0;
      font-size: 16px;
    }

    /* Animated Gradient Box */
    .moving-color-box {
      width: 100%;
      height: 250px;
      background: linear-gradient(270deg, #aec6ff, #b2c6f7, #f2afff);
      background-size: 600% 600%;
      animation: colorShift 6s ease infinite;
    }

    @keyframes colorShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html">Home</a>
    <a href="changelog.html">Changelog</a>
  </nav>

  <!-- Top Banner -->
  <img src="banner.jpg" alt="Top Banner" class="banner" onerror="this.style.display='none'">

  <div class="content">
    <h1>Hello, World!</h1>
    <p>Welcome to my website</p>
  </div>

  <!-- Animated Gradient Section -->
  <div class="moving-color-box"></div>

</body>
</html>
